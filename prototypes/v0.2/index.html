    function modeOf(a){return PLATFORM[a?.platform]?.mode==='manual'?'manual':'auto'}
    function normalizeDeliveries(p){
      if(!p.destinations||typeof p.destinations!=='object'||Array.isArray(p.destinations))p.destinations={};
      (p.targets||[]).forEach(id=>{const a=account(id);if(!a)return;
        const old=p.destinations[id];
        if(!old){p.destinations[id]={enabled:true,mode:modeOf(a),status:p.status==='published'&&modeOf(a)==='auto'?'simulated':p.status==='scheduled'&&modeOf(a)==='auto'?'planned':'pending',completedAt:null,link:'',notes:''};}
        else {old.mode=modeOf(a);if(typeof old.enabled!=='boolean')old.enabled=true;if(!old.status)old.status='pending'}
      });
      Object.keys(p.destinations).forEach(id=>{if(!(p.targets||[]).includes(id))delete p.destinations[id]});
      return p.destinations;
    }
    function normalizeAll(){
      if(!state.accounts.some(a=>a.id==='a7')&&!state.accounts.some(a=>a.platform==='whatsapp'&&a.brandId==='jan'))state.accounts.push({id:'a7',brandId:'jan',platform:'whatsapp',handle:'Digital-Tipps Südwestpfalz (Demo)',status:'demo'});
      if(!state.accounts.some(a=>a.id==='a8')&&!state.accounts.some(a=>a.platform==='telegram'&&a.brandId==='nui'))state.accounts.push({id:'a8',brandId:'nui',platform:'telegram',handle:'NUI Neuigkeiten (Demo)',status:'demo'});
      state.posts.forEach(normalizeDeliveries);
    }

        <div class="grid4 bottommargin">${metaStat('Beitragsgruppen',posts.length,'pen','Ein Beitrag · mehrere Zielversionen')}${metaStat('Manuelle Aufgaben',mTasks.length,'check','Nicht als erledigt bestätigt')}${metaStat('Aktive Zielkonten',posts.reduce((n,p)=>n+deliveryStats(p).active.length,0),'users','Einzelne Veröffentlichungsziele')}${metaStat('Manuell dokumentiert',posts.reduce((n,p)=>n+deliveryStats(p).confirmed.length,0),'shield','Mit Zeitpunkt und Notiz')}</div>
        <div class="pub-toolbar"><h2 style="margin:0;font-size:17px">Beiträge für die Veröffentlichung</h2><button class="btn" data-action="go" data-id="manual">${ico('check')} Manuelle Aufgaben (${mTasks.length})</button></div>
        <div class="pub-list">${posts.length?posts.map(p=>`<article class="card pub-list-item"><div class="mini-cover">${postEmoji(p)}</div><div><h3>${esc(p.title)}</h3><p>${esc(brandName(p.brandId))} · ${esc(displayDate(p.scheduledAt))} · ${esc(statuses[p.status]||p.status)}</p>${progressFor(p)}</div><div class="pub-list-actions"><button class="btn tiny" data-action="edit-post" data-id="${esc(p.id)}">Bearbeiten</button><button class="btn primary small" data-v2="open-review" data-post="${esc(p.id)}">Alle Vorschauen →</button></div></article>`).join(''):empty('Noch keine Beiträge','Erstelle einen Entwurf, um den Veröffentlichungsablauf zu testen.')}</div>`;
    }
    function manualView(){let tasks=[];for(const p of filteredPosts())for(const id of p.targets||[]){const a=account(id);if(a&&modeOf(a)==='manual'){normalizeDeliveries(p);if(p.destinations[id]?.enabled)tasks.push({p,a,id,d:p.destinations[id]})}}
      const open=tasks.filter(t=>t.d.status!=='manual-confirmed'),done=tasks.filter(t=>t.d.status==='manual-confirmed');const item=({p,a,id,d})=>`<article class="card pub-manual-item">${platformBadge(a.platform)}<div><h3>${esc(p.title)}</h3><p>${esc(a.handle)} · ${esc(brandName(p.brandId))} · ${d.status==='manual-confirmed'?`Bestätigt ${esc(displayDate(d.completedAt))}`:'Noch nicht als veröffentlicht bestätigt'}</p>${d.link?`<p style="margin-top:5px">Referenz: ${esc(d.link)}</p>`:''}</div><div class="pub-manual-actions"><button class="btn tiny" data-v2="copy-caption" data-post="${esc(p.id)}" data-account="${esc(id)}">${ico('copy')} Text kopieren</button><button class="btn tiny" data-v2="open-review" data-post="${esc(p.id)}">Vorschau</button>${d.status==='manual-confirmed'?`<button class="btn tiny" data-v2="undo-manual" data-post="${esc(p.id)}" data-account="${esc(id)}">Bestätigung zurücknehmen</button>`:`<button class="btn primary small" data-v2="confirm-manual" data-post="${esc(p.id)}" data-account="${esc(id)}">✓ Als veröffentlicht markieren</button>`}</div></article>`;
      return head('Manuelle Ausspielung','Messenger & manuelle Kanäle','Kopieren, selbst veröffentlichen und anschließend verbindlich dokumentieren.')+demoNote('Die Kopierfunktion überträgt ausschließlich Text in die Zwischenablage. Bilder und Videos müssen separat über die jeweilige App geteilt werden. Keine Messenger-Nachricht wird automatisch gesendet.')+`<section class="pub-hero"><div><h2>Manuell heißt nicht unorganisiert.</h2><p>WhatsApp-Kanäle und andere manuelle Ziele bleiben Teil derselben Veröffentlichungsgruppe. Erledigungen erhalten Zeitpunkt und optionale Referenz.</p></div><button class="btn" data-action="go" data-id="publishing">Alle Beiträge ansehen →</button></section><div class="pub-section-label">Offen (${open.length})</div><div class="pub-list">${open.length?open.map(item).join(''):empty('Keine offenen Aufgaben','Für alle aktiven manuellen Ziele liegt eine Bestätigung vor oder es wurde noch kein Ziel ausgewählt.')}</div><div class="pub-section-label">Dokumentiert (${done.length})</div><div class="pub-list">${done.length?done.map(item).join(''):empty('Noch keine bestätigten Veröffentlichungen','Nach einer manuellen Veröffentlichung kannst du hier die Bestätigung erfassen.')}</div>`;
    }
    const previewWarnings=(p,a,txt)=>{const issues=[];const max=PLATFORM[a.platform]?.limit;
      if(typeof max==='number'&&txt.length>max)issues.push(`Text überschreitet einen Orientierungswert (${txt.length}/${max} Zeichen).`);
      if(['instagram','pinterest','tiktok'].includes(a.platform)&&p.type==='text')issues.push('Text ohne Medien: Plattformformat vor dem Versand prüfen.');
      if(['instagram','tiktok','pinterest'].includes(a.platform)&&!p.mediaId)issues.push('Kein Medium zugewiesen; ein Medienbeitrag kann erforderlich sein.');
      if(modeOf(a)==='manual'&&p.mediaId)issues.push('Medien müssen zusätzlich manuell übertragen werden.');return issues};
    function platformPreview(p,a){const txt=(p.overrides?.[a.id]||p.text||'');const media=mediaById(p.mediaId),emoji=media?.emoji||({text:'✍️',video:'🎬',carousel:'🖼️'}[p.type]||'📝'),isMedia=p.type!=='text',h=esc(a.handle),brand=esc(brandName(p.brandId));
      return `<div class="pub-faux ${esc(a.platform)}" aria-label="Annähernde Vorschau für ${esc(PLATFORM[a.platform]?.label)}"><div class="pub-faux-head"><div class="pub-faux-avatar">${esc(brandName(p.brandId).slice(0,1))}</div><div style="flex:1;min-width:0"><strong>${brand}</strong><div class="pub-faux-platform">${h} · ${esc(PLATFORM[a.platform].label)}</div></div><span class="pub-faux-platform">•••</span></div>${isMedia?`<div class="pub-faux-media">${esc(emoji)}</div>`:''}<div class="pub-faux-text" data-v2-preview="${esc(a.id)}">${esc(txt||'Noch kein Text vorhanden.')}</div><div class="pub-faux-foot"><span>${modeOf(a)==='manual'?'◌ Manuell teilen':'♡  ◯  ↗'}</span><span>Nur visuelle Annäherung</span></div></div>`}
    function destinationCard(p,id){const a=account(id),d=p.destinations[id];if(!a||!d)return'';const txt=p.overrides?.[id]||p.text||'',issues=previewWarnings(p,a,txt);let done=d.status==='manual-confirmed',scheduled=d.status==='planned',sim=d.status==='simulated';return `<article class="pub-card ${d.enabled?'':'inactive'}" data-v2-card="${esc(id)}"><div class="pub-card-head"><div class="pub-card-name">${platformBadge(a.platform)}<div style="min-width:0"><strong>${esc(PLATFORM[a.platform].label)}</strong><small>${esc(a.handle)}</small></div></div><label class="switch" title="Ziel ${d.enabled?'deaktivieren':'aktivieren'}"><input type="checkbox" data-v2-toggle="${esc(id)}" ${d.enabled?'checked':''}><span></span></label></div><div class="pub-card-inner"><div class="pub-method">${showModeBadge(a)}<span class="status-mini ${done?'done':modeOf(a)==='manual'?'manual':'auto'}">${done?'✓ Manuell bestätigt':sim?'Nur simuliert':scheduled?'Demo: geplant':'Noch offen'}</span></div>${platformPreview(p,a)}<div><label class="pub-caption" for="pub-variant-${esc(id)}">Individuelle Textvariante</label><textarea class="pub-edit" id="pub-variant-${esc(id)}" data-v2-variant="${esc(id)}" placeholder="Leer = gemeinsamer Beitragstext">${esc(p.overrides?.[id]||'')}</textarea><div class="pub-caption-foot"><span>${p.overrides?.[id]?'Individuelle Fassung':'Gemeinsamer Text'}</span><span data-v2-length="${esc(id)}">${txt.length} Zeichen</span></div></div><div data-v2-warnings="${esc(id)}">${issues.map(m=>`<p class="pub-warning">⚠ ${esc(m)}</p>`).join('')}</div><div class="pub-card-actions">${modeOf(a)==='manual'?`<button class="btn" data-v2="copy-caption" data-post="${esc(p.id)}" data-account="${esc(id)}">${ico('copy')} Text kopieren</button>${done?`<button class="btn" data-v2="undo-manual" data-post="${esc(p.id)}" data-account="${esc(id)}">✓ Rückgängig</button>`:`<button class="btn" data-v2="confirm-manual" data-post="${esc(p.id)}" data-account="${esc(id)}">✓ Erledigt</button>`}`: `<span class="status-mini auto">Getrennter API-Auftrag (später)</span>`}</div></div></article>`}
    function showPublishingReview(postId){const p=state.posts.find(x=>x.id===postId);if(!p)return toast('Beitrag nicht gefunden.');normalizeDeliveries(p);const st=deliveryStats(p),all=p.targets.filter(id=>account(id));const body=`<div class="pub-steps"><span class="pub-step"> <strong>1</strong> Inhalt</span><span class="pub-step current"><strong>2</strong> Plattformvarianten & Prüfung</span><span class="pub-step"><strong>3</strong> Veröffentlichung & Nachweis</span></div><div class="pub-review-top"><div><h3>${esc(p.title)}</h3><p>${esc(brandName(p.brandId))} · ${esc(displayDate(p.scheduledAt))} · ${esc(p.type)}<br>Ein Schalter je Plattform · individuelle Fassung direkt anpassen</p></div><div class="pub-review-metrics"><span class="status-mini auto">${st.automatic.length} API-Ziele</span><span class="status-mini manual">${st.manual.length} manuell</span><span class="status-mini done">${st.confirmed.length} bestätigt</span></div></div><div class="pub-review-grid">${all.map(id=>destinationCard(p,id)).join('')||'<div class="note">Bitte zunächst im Beitragseditor Zielkonten auswählen.</div>'}</div><p class="pub-foot-note">Wichtig: Vorschauen sind illustrative Annäherungen, keine verbindlichen Originaldarstellungen. Plattformformate, Medien-Limits und Berechtigungen müssen bei einer echten API-Anbindung laufend geprüft werden. Ein Klick auf „API-Lauf simulieren“ veröffentlicht nichts.</p>`;
      const foot=`<button class="btn quiet" data-action="close-modal">Schließen</button><button class="btn" data-v2="edit-from-review" data-post="${esc(p.id)}">${ico('pen')} Inhalt bearbeiten</button>${p.approval==='pending'?`<button class="btn" data-v2="approve-review" data-post="${esc(p.id)}">Freigabe erteilen</button>`:''}<button class="btn" data-v2="schedule-review" data-post="${esc(p.id)}">${ico('calendar')} Aktive Ziele planen</button><button class="btn primary" data-v2="simulate-review" data-post="${esc(p.id)}">${ico('zap')} API-Lauf simulieren</button>`;
      modalShell('Plattformvorschau & Veröffentlichung',body,foot,true,'Ein Beitrag, mehrere einzelne Veröffentlichungsaufträge');document.querySelector('.modal')?.classList.add('publish-modal');
    }
    function storeComposerAndReview(){syncComposer();const p=draftEdit;if(!p||!p.title.trim()||!p.text.trim())return toast('Bitte erst Titel und Beitragstext ausfüllen.');if(!p.targets.length)return toast('Bitte mindestens ein Zielkonto auswählen.');const previous=state.posts.find(x=>x.id===p.id);const saved={...p,id:p.id||uid('post'),status:p.status||'draft',createdAt:p.createdAt||new Date().toISOString(),scheduledAt:p.scheduledAt?new Date(p.scheduledAt).toISOString():null,targets:[...p.targets],overrides:{...p.overrides},destinations:{...(previous?.destinations||p.destinations||{})}};
      if(p.approval==='pending')saved.status='review';normalizeDeliveries(saved);const ix=state.posts.findIndex(x=>x.id===saved.id);if(ix>=0)state.posts[ix]=saved;else state.posts.unshift(saved);emit('Beitrag in die Plattformprüfung übernommen',saved.title);closeModal();showPublishingReview(saved.id);
    }
    function transitionBatch(postId,action){const p=state.posts.find(x=>x.id===postId);if(!p)return;const s=deliveryStats(p);if(!s.active.length)return toast('Mindestens ein aktives Ziel auswählen.');if(p.approval==='pending')return toast('Der Beitrag wartet noch auf Freigabe. Bitte zuerst freigeben.');
      if(action==='schedule'){if(!p.scheduledAt||new Date(p.scheduledAt)<=new Date())return toast('Zum Planen bitte im Beitragseditor ein zukünftiges Datum einstellen.');p.status='scheduled';}
      if(action==='simulate'&&!s.automatic.length)return toast('Keine automatischen Ziele aktiv. Manuelle Ziele einzeln bestätigen.');
      let changed=0;for(const id of s.active){const d=p.destinations[id],a=account(id);if(!d||!a)continue;if(modeOf(a)==='manual'){if(d.status!=='manual-confirmed')d.status='manual-pending';}else{d.status=action==='schedule'?'planned':'simulated';d.completedAt=action==='simulate'?new Date().toISOString():null;changed++}}
      if(action==='simulate')p.status='published';emit(action==='schedule'?'Demo-Planung gespeichert':'Automatischen API-Lauf simuliert',`${p.title} · ${changed} automatische Ziele · ${s.manual.length} manuelle Ziele`);showPublishingReview(p.id);toast(action==='schedule'?'Geplante Ziele nur lokal gespeichert. Keine automatische Ausführung.':`${changed} API-Ziele nur simuliert. Keine echte Veröffentlichung. Manuelle Ziele bleiben offen.`);
    }
    function confirmManual(postId,accountId){const p=state.posts.find(x=>x.id===postId),a=account(accountId);if(!p||!a||modeOf(a)!=='manual'||!p.targets.includes(accountId))return;if(!p.destinations?.[accountId]?.enabled)return toast('Dieses Ziel ist deaktiviert.');const d=p.destinations[accountId];modalShell('Manuelle Veröffentlichung bestätigen',`<div class="note"><strong>${esc(PLATFORM[a.platform].label)} · ${esc(a.handle)}</strong><br>${esc(p.title)}<br>Bitte erst bestätigen, nachdem der Beitrag tatsächlich außerhalb dieses Prototyps veröffentlicht wurde.</div><div class="formgrid" style="margin-top:18px"><div class="formgroup full"><label>Link zum Beitrag (optional)</label><input id="manual-link" type="url" maxlength="500" placeholder="https://…" value="${esc(d.link||'')}"></div><div class="formgroup full"><label>Interne Notiz (optional)</label><textarea id="manual-notes" maxlength="1000" placeholder="Wo veröffentlicht? Besonderheiten …" style="min-height:78px">${esc(d.notes||'')}</textarea></div></div>`,`<button class="btn" data-v2="back-review" data-post="${esc(postId)}">Zurück zur Vorschau</button><button class="btn primary" data-v2="save-manual" data-post="${esc(postId)}" data-account="${esc(accountId)}">✓ Tatsächlich veröffentlicht</button>`)}
    function updateConfirmation(postId,accountId){const p=state.posts.find(x=>x.id===postId),a=account(accountId);if(!p||!a||modeOf(a)!=='manual')return;const d=p.destinations?.[accountId];if(!d||!d.enabled)return;const link=document.getElementById('manual-link')?.value.trim()||'';if(link&&!/^https?:\/\//i.test(link))return toast('Bitte eine vollständige https://- oder http://-Adresse verwenden.');d.link=link;d.notes=document.getElementById('manual-notes')?.value.trim()||'';d.status='manual-confirmed';d.completedAt=new Date().toISOString();emit('Manuelle Veröffentlichung bestätigt',`${p.title} · ${PLATFORM[a.platform].label} · ${a.handle}`);closeModal();if(currentView==='manual')render();else showPublishingReview(p.id);toast('Externe Veröffentlichung als manuell bestätigt dokumentiert.');}
    function undoManual(postId,accountId){const p=state.posts.find(x=>x.id===postId),a=account(accountId);if(!p||!a||modeOf(a)!=='manual')return;const d=p.destinations?.[accountId];if(!d||d.status!=='manual-confirmed')return;if(!confirm(`Bestätigung für „${a.handle}“ zurücknehmen?`))return;d.status='manual-pending';d.completedAt=null;emit('Manuelle Bestätigung zurückgenommen',`${p.title} · ${a.handle}`);if(modal)showPublishingReview(p.id);else render()}
    async function copyCaption(postId,accountId){const p=state.posts.find(x=>x.id===postId);if(!p)return;const textToCopy=(p.overrides?.[accountId]||p.text||'');if(!textToCopy.trim())return toast('Kein Text vorhanden.');let ok=false;try{await navigator.clipboard.writeText(textToCopy);ok=true}catch{}
      if(!ok){try{const ta=document.createElement('textarea');ta.value=textToCopy;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch{}}
      if(ok){emit('Text für manuellen Kanal kopiert',`${p.title} · ${account(accountId)?.handle||accountId}`);toast('Beitragstext kopiert. In der Ziel-App einfügen; Medien ggf. separat übertragen.');}else{modalShell('Text zum manuellen Kopieren',`<p class="smalltxt muted">Dein Browser erlaubt hier keinen automatischen Zugriff auf die Zwischenablage. Den Text markieren und kopieren:</p><textarea readonly class="pub-edit" style="min-height:180px" id="copy-fallback">${esc(textToCopy)}</textarea>`,`<button class="btn primary" data-v2="select-copy-fallback">Text markieren</button>`)}
    }
    // Keep the existing composer and add the multi-target review as a mandatory next step.
    // In V0.1, saving an existing post and changing targets could retain stale delivery objects.
    const previousShowComposer=showComposer;
    showComposer=function(){previousShowComposer();const foot=document.querySelector('.modalfoot');if(foot&&!foot.querySelector('[data-v2="review-from-composer"]'))foot.insertAdjacentHTML('beforeend',`<button class="btn primary" data-v2="review-from-composer">${ico('check')} Alle Plattformen prüfen →</button>`)};
    normalizeAll();
    registerView('publishing',publishingView);registerView('manual',manualView);
    document.addEventListener('click',async e=>{
      const el=e.target.closest('[data-v2]');if(!el)return;e.preventDefault();e.stopPropagation();const action=el.dataset.v2,postId=el.dataset.post,accountId=el.dataset.account;
      switch(action){
        case 'review-from-composer':storeComposerAndReview();break;
        case 'open-review':showPublishingReview(postId);break;
        case 'edit-from-review':{const p=state.posts.find(x=>x.id===postId);if(p){closeModal();newPost(p)}break}
        case 'approve-review':{const p=state.posts.find(x=>x.id===postId);if(p){p.approval='approved';p.status='draft';emit('Freigabe lokal erteilt',p.title);showPublishingReview(postId)}break}
        case 'back-review':showPublishingReview(postId);break;
        case 'schedule-review':transitionBatch(postId,'schedule');break;
        case 'simulate-review':transitionBatch(postId,'simulate');break;
        case 'confirm-manual':confirmManual(postId,accountId);break;
        case 'save-manual':updateConfirmation(postId,accountId);break;
        case 'undo-manual':undoManual(postId,accountId);break;
        case 'copy-caption':await copyCaption(postId,accountId);break;
        case 'select-copy-fallback':{const t=document.getElementById('copy-fallback');t?.focus();t?.select();break}
      }
    },true);
    document.addEventListener('change',e=>{
      const id=e.target.dataset.v2Toggle;if(!id)return;e.stopPropagation();const postId=modal?.postId||document.querySelector('.pub-review-grid')?.dataset.post;
      const p=state.posts.find(x=>x.id===publicationReviewId);if(!p||!p.destinations?.[id])return;p.destinations[id].enabled=e.target.checked;
      emit('Zielkonto '+(e.target.checked?'aktiviert':'deaktiviert'),`${p.title} · ${account(id)?.handle||id}`);showPublishingReview(p.id);
    },true);
    let publicationReviewId=null;
    const priorShowPublishingReview=showPublishingReview;
    showPublishingReview=function(id){publicationReviewId=id;priorShowPublishingReview(id)};
    document.addEventListener('input',e=>{
      const id=e.target.dataset.v2Variant;if(!id)return;e.stopPropagation();const p=state.posts.find(x=>x.id===publicationReviewId);if(!p)return;p.overrides[id]=e.target.value;persist();const a=account(id);if(!a)return;const txt=p.overrides[id]||p.text||'';const prev=document.querySelector(`[data-v2-preview="${CSS.escape(id)}"]`);if(prev)prev.textContent=txt||'Noch kein Text vorhanden.';const length=document.querySelector(`[data-v2-length="${CSS.escape(id)}"]`);if(length)length.textContent=`${txt.length} Zeichen`;const warn=document.querySelector(`[data-v2-warnings="${CSS.escape(id)}"]`);if(warn)warn.innerHTML=previewWarnings(p,a,txt).map(s=>`<p class="pub-warning">⚠ ${esc(s)}</p>`).join('');
    },true);

    render();persist();
    // Öffentlicher, rein lokaler Modulkatalog für die HTML-Konzeptphase.
    window.SocialHubConcept=Object.freeze({version:'0.2',registerView:(id,renderFn)=>{if(typeof renderFn==='function'){registerView(id,renderFn);render()}},getSnapshot:()=>JSON.parse(JSON.stringify(state)),listPlatforms:()=>Object.keys(PLATFORM)});
  })();
  </script>
</body>
